deployAs:
  - name: event
    applicationType: event
    endpoint: /event
    scripts:
      postDeploy: yarn install --frozen-lockfile && yarn build && yarn connector:post-deploy
      preUndeploy: yarn install --frozen-lockfile && yarn build && yarn connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          required: true
          default: "europe-west1.gcp"
        - key: API_ENDPOINT
          description: External API endpoint URL to forward events to
          required: true
        - key: SUBSCRIPTION_SUFFIX
          description: Suffix appended to fixed key prefix "ct-event-proxy-subscription-" (e.g., "dev-a"). Use a different suffix per deployment in the same commercetools project to avoid deployments overwriting each other's subscription.
          required: true
        - key: SUBSCRIPTION_CONFIG
          description: JSON object with messages and changes arrays (e.g., {"messages":[{"resourceTypeId":"order","types":["OrderCreated"]}],"changes":[{"resourceTypeId":"product"}]}). Invalid JSON or structure fails deployment.
          required: false
        - key: ADDITIONAL_HEADERS
          description: JSON object of additional headers to send with webhook requests (e.g., {"X-Vercel-Protection-Bypass":"secret"})
          required: false
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools Composable Commerce project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools Composable Commerce client ID
          required: true
        - key: CTP_CLIENT_SECRET
          description: commercetools Composable Commerce client secret
          required: true
        - key: CTP_SCOPE
          description: commercetools Composable Commerce client scope
          required: true
        - key: WEBHOOK_SECRET
          description: Secret key for HMAC signature generation (shared with receiving API)
          required: true
