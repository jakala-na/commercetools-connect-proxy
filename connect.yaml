deployAs:
  - name: event
    applicationType: event
    endpoint: /event
    scripts:
      postDeploy: npm install && npm run build && npm run connector:post-deploy
      preUndeploy: npm install && npm run build && npm run connector:pre-undeploy
    configuration:
      standardConfiguration:
        - key: CTP_REGION
          description: commercetools Composable Commerce API region
          required: true
          default: "europe-west1.gcp"
        - key: API_ENDPOINT
          description: External API endpoint URL to forward events to
          required: true
        - key: SUBSCRIPTION_CONFIG
          description: JSON array of message subscriptions (e.g., [{"resourceTypeId":"order","types":["OrderCreated"]}])
          required: false
        - key: MAX_RETRIES
          description: Maximum retry attempts for failed webhook deliveries
          required: false
          default: "3"
        - key: RETRY_DELAY_MS
          description: Initial delay in milliseconds between retries (uses exponential backoff)
          required: false
          default: "1000"
        - key: ADDITIONAL_HEADERS
          description: JSON object of additional headers to send with webhook requests (e.g., {"X-Vercel-Protection-Bypass":"secret"})
          required: false
      securedConfiguration:
        - key: CTP_PROJECT_KEY
          description: commercetools Composable Commerce project key
          required: true
        - key: CTP_CLIENT_ID
          description: commercetools Composable Commerce client ID
          required: true
        - key: CTP_CLIENT_SECRET
          description: commercetools Composable Commerce client secret
          required: true
        - key: CTP_SCOPE
          description: commercetools Composable Commerce client scope
          required: true
        - key: WEBHOOK_SECRET
          description: Secret key for HMAC signature generation (shared with receiving API)
          required: true
inheritAs:
  configuration:
    securedConfiguration:
      - key: GLOBAL_SECURED_CONFIGURATION
        description: This secured configuration will configuration will be applied to all applications
        required: true
    standardConfiguration:
      - key: GLOBAL_STANDARD_CONFIGURATION
        description: This standard configuration will configuration will be applied to all applications
        required: true